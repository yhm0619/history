            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            background:transparent;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
.carousel-title {
    text-align: center;
    font-size: 36px;
    color: #fff;
    margin-bottom: 40px;
    margin-top: -50px;
    position: relative;
}
.carousel-title::before,
.carousel-title::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 130px;
    height: 3px;
    transform: translateY(-50%);
}
.carousel-title::before {
    left: -150px;
    background: linear-gradient(to right, transparent, #fff 70%);
}
.carousel-title::after {
    right: -150px;
    background: linear-gradient(to left, transparent, #fff 70%);
}

       .carousel-subtitle {
    text-align: center;
    color: #fff;
    font-size: 16px;
    margin-bottom: 40px;
    margin-top: -10px;
}

        .carousel-container {
    width: 90%;
    max-width: 1400px;
    height: 450px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    border-radius: 10px;
}
        .carousel-track {
            display: flex;
            width: max-content;
            position: absolute;
            will-change: transform;
        }


.carousel-item {
    width: 300px;
    height: 390px;
    margin: 0 15px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    border: 2px solid #B89B58;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
}

.carousel-item img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    display: block;
    object-position: center top;
    flex-shrink: 0;
}

.carousel-item h3 {
    width: 100%;
    height: 40px;
    line-height: 40px;
    text-align: center;
    color: #fff;
    background: rgba(0,0,0,0.7);
    padding: 0;
    font-size: 16px;
    margin: 0;
    flex-shrink: 0;
}

        .carousel-item:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        /* 热区：鼠标悬停控制方向 */
        .hotzone-left, .hotzone-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 20%;
            z-index: 5;
            cursor: pointer;
            background: transparent;
        }

        .hotzone-left {
            left: 0;
        }

        .hotzone-right {
            right: 0;
        }

        /* 向下箭头 */
        .arrow-down {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            fill: #fff;
            cursor: pointer;
            animation: bounce 2s infinite;
            transition: fill 0.3s ease;
        }

        .arrow-down:hover {
            fill: #C8161C;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-20px); }
            60% { transform: translateX(-50%) translateY(-10px); }
        }

        /* 轮播过渡状态 */
        .carousel-section.shrink {
            transform: scale(0.6) translateY(-20%);
            opacity: 0.4;
        }

        .carousel-section.exit {
            transform: translateY(-100%) scale(0.6);
            opacity: 0;
            z-index: 5;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            display: flex;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-img {
            max-width: 50%;
            max-height: 80vh;
            object-fit: cover;
            border-radius: 8px 0 0 8px;
        }

        .modal-info {
            width: 400px;
            background: #F5F0E6;
            padding: 30px;
            border-radius: 0 8px 8px 0;
        }

        .modal-info h3 {
            color: #C8161C;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .modal-info p {
            color: #333;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .info-keyword {
            font-weight: bold;
            color: #B89B58;
            display: inline-block;
            background: rgba(184, 155, 88, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        /* 信封 */
        .envelope-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 15;
            background: url("b/back.png");
            background-size: cover;
        }

        .envelope {
            width: 60vw;
            max-width: 800px;
            height: 40vh;
            max-height: 400px;
            background: #f8f4e9;
            position: relative;
            transform-style: preserve-3d;
            transition: all 1s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transform: translateY(100%);
            border: 1px solid #d4c9a8;
            border-radius: 4px;
        }

        .envelope.rise {
            transform: translateY(0);
        }

        .envelope-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f8f4e9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 左上角邮编框 */
        .envelope .postcode-boxes {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
        }
        .envelope .postcode-boxes span {
            width: 24px;
            height: 24px;
            border: 1px solid #c8161c;
        }

        /* 右上角邮票框 */
        .envelope .stamp-area {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border: 1px dashed #c8161c;
        }

        /* 右下角文字信息 */
        .envelope .footer-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            color: #c8161c;
            font-size: 12px;
            line-height: 1.5;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #e6dccc;
            transform-origin: top;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 70%, 0 100%);
            z-index: 10;
            transition: transform 0.8s ease 0.3s;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
        }

        .open-btn {
            background: #C8161C;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            animation: breathe 2s infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            transition: background 0.3s ease;
        }

        .open-btn:hover {
            background: #a01217;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        /* 信纸 */
       .letter-container {

            left: 0;

            height: 100%;

            opacity: 1;
            transform: translateY(0);
        }

        .letter-paragraph.show::before {
            width: 0;

    </style>

        const arrowDown = document.getElementById('arrowDown');
        const envelopeContainer = document.getElementById('envelopeContainer');
        const envelope = document.getElementById('envelope');
        const openBtn = document.getElementById('openBtn');
        const letterContainer = document.getElementById('letterContainer');
        const letter = document.getElementById('letter');
        const letterContent = document.getElementById('letterContent');
        const canvas = document.getElementById('signatureCanvas');
        const clearBtn = document.getElementById('clearBtn');
        const submitBtn = document.getElementById('submitBtn');
        const countNum = document.getElementById('countNum');

        // 全局状态
        let position = 0;
        let defaultSpeed = 0.5;
        let hoverSpeed = 2;
        let currentSpeed = defaultSpeed;
        let direction = 1;
        let isRunning = true;
        let currentPage = 0;
        let itemWidth = 0;
        let isAnimating = false;

        // 轮播逻辑
        function initCarousel() {
            for (let i = 0; i < 3; i++) {
                peopleData.forEach((person, index) => {
                    const item = createCarouselItem(person, index);
                    carouselTrack.appendChild(item);
                });
            }
            const firstItem = document.querySelector('.carousel-item');
            itemWidth = firstItem.offsetWidth + 30;
            position = itemWidth * peopleData.length;
            carouselTrack.style.transform = `translateX(-${position}px)`;
            animateCarousel();

            leftHotzone.addEventListener('mouseenter', () => {
                if (currentPage === 0) {
                    direction = -1;
                    currentSpeed = hoverSpeed;
                }
            });
            leftHotzone.addEventListener('mouseleave', () => {
                if (currentPage === 0) {
                    direction = 1;
                    currentSpeed = defaultSpeed;
                }
            });

            rightHotzone.addEventListener('mouseenter', () => {
                if (currentPage === 0) {
                    direction = 1;
                    currentSpeed = hoverSpeed;
                }
            });
            rightHotzone.addEventListener('mouseleave', () => {
                if (currentPage === 0) {
                    direction = 1;
                    currentSpeed = defaultSpeed;
                }
            });
        }

        function createCarouselItem(person, index) {
            const item = document.createElement('div');
            item.className = 'carousel-item';
            item.innerHTML = `<img src="${person.img}" alt="${person.name}"><h3>${person.name}</h3>`;
            
            item.addEventListener('mouseenter', () => {
                if (currentPage === 0) isRunning = false;
            });
            item.addEventListener('mouseleave', () => {
                if (currentPage === 0) isRunning = true;
            });
            
            item.addEventListener('click', () => showModal(person));
            return item;
        }

        function animateCarousel() {
            if (isRunning) {
                position += currentSpeed * direction;
                if (position >= itemWidth) {
                    carouselTrack.appendChild(carouselTrack.firstElementChild);
                    position -= itemWidth;
                }
                if (position <= 0) {
                    carouselTrack.insertBefore(carouselTrack.lastElementChild, carouselTrack.firstElementChild);
                    position += itemWidth;
                }
                carouselTrack.style.transform = `translateX(-${position}px)`;
            }
            requestAnimationFrame(animateCarousel);
        }

        function showModal(person) {
            modalImg.src = person.img;
            modalName.textContent = person.name;
            modalBio.textContent = person.bio;
            modalKeyword.textContent = person.keyword;
            modalExplanation.textContent = person.explanation;
            modal.style.display = 'flex';
            isRunning = false;
        }

        function hideModal() {
            modal.style.display = 'none';
            if (currentPage === 0) isRunning = true;
        }

        function initLetterContent() {
            letterParagraphs.forEach(para => {
                const p = document.createElement('p');
                p.className = 'letter-paragraph';
                p.innerHTML = para;
                letterContent.appendChild(p);
            });
        }

        
        function showLetterLines() {
            document.querySelectorAll('.letter-paragraph').forEach((p, i) => {
                setTimeout(() => p.classList.add('show'), i * 150);
            });
        }

        function goToEnvelope() {
            if (currentPage !== 0 || isAnimating) return;
            isAnimating = true; currentPage = 1; isRunning = false;
            carouselSection.classList.add('shrink');
            setTimeout(() => {
                envelopeContainer.style.display = 'flex';
                setTimeout(() => {
                    envelope.classList.add('rise');
                    setTimeout(() => isAnimating = false, 1000);
                }, 100);
                setTimeout(() => carouselSection.classList.add('exit'), 800);
            }, 300);
        }

        function goToCarousel() {
            if (currentPage !== 1 || isAnimating) return;
            isAnimating = true;
            envelope.classList.remove('rise');
            carouselSection.classList.remove('exit');
            setTimeout(() => {
                envelopeContainer.style.display = 'none';
                carouselSection.classList.remove('shrink');
                currentPage = 0; isRunning = true;
                setTimeout(() => isAnimating = false, 500);
            }, 800);
        }

        function goToLetter() {
            if (currentPage !== 1 || isAnimating) return;
            isAnimating = true;
            envelope.classList.add('open');
            setTimeout(() => {
                envelopeContainer.style.display = 'none';
                letterContainer.style.display = 'flex';
                setTimeout(() => {
                    letter.classList.add('show');
                    setTimeout(showLetterLines, 300);
                    currentPage = 2;
                    letter.scrollTop = 0;
                    setTimeout(() => isAnimating = false, 800);
                }, 100);
            }, 800);
        }

        function backToEnvelope() {
            if (currentPage !== 2 || isAnimating) return;
            isAnimating = true;
            letter.classList.remove('show');
            setTimeout(() => {
                letterContainer.style.display = 'none';
                envelopeContainer.style.display = 'flex';
                envelope.classList.remove('open');
                currentPage = 1;
                setTimeout(() => isAnimating = false, 500);
            }, 500);
        }

        // 滚轮逻辑
        window.addEventListener('wheel', (e) => {
            if (isAnimating) return;
            const delta = e.deltaY;

            if (currentPage === 0) {
                if (delta > 0) goToEnvelope();
            } 
            else if (currentPage === 1) {
                if (delta < 0) goToCarousel();
                else e.preventDefault();
            }
        }, { passive: false });

        letter.addEventListener('wheel', (e) => {
            if (isAnimating) return;
            const delta = e.deltaY;
            const scrollTop = letter.scrollTop;
            const scrollHeight = letter.scrollHeight;
            const clientHeight = letter.clientHeight;
            const isAtTop = scrollTop <= 5;

            if (delta < 0 && isAtTop) {
                e.preventDefault();
                backToEnvelope();
            }
        }, { passive: false });

        arrowDown.addEventListener('click', goToEnvelope);
        openBtn.addEventListener('click', goToLetter);
        modal.addEventListener('click', e => { if (e.target === modal) hideModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') hideModal(); });

        // ========== 修复签名板不能写字 ==========
function initSignatureArea() {
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    const rect = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.strokeStyle = '#C8161C';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
  });
  canvas.addEventListener('mouseup', () => isDrawing = false);
  canvas.addEventListener('mouseleave', () => isDrawing = false);

  clearBtn.onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
  submitBtn.onclick = () => alert('签名提交成功！');
}
// ========== 修复结束 ==========

        window.addEventListener('load', () => {
            initCarousel();
            initLetterContent();
            initSignatureArea();
        });
    </script>
</body>
</html>
