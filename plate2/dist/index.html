<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中国工农红军长征路线图</title>
    <script type="module" crossorigin src="./assets/index-CkL-4juK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CqJdx2DC.css">
    <style>
      /* === 去掉滚动条，全部显示 === */
      html, body { overflow: hidden; height: 100%; }
      #root { height: 100%; }
      .war-room { min-height: auto; height: 100%; padding: 10px clamp(10px,2vw,24px); }

      /* === 放大主路线区域 === */
      .map-stage { aspect-ratio: auto; height: calc(100vh - 80px); min-height: 0; overflow: hidden; }
      /* 缩放SVG以放大路线 — china-map 本身就是 SVG 元素 */
      .china-map {
        width: 100%; height: 100%;
        transform: scale(1.3);
        transform-origin: 54% 48%;
      }

      /* === 隐藏省份名标注 === */
      .province-label { display: none !important; }
      .province-callout { display: none !important; }

      /* === 主路线节点标注更醒目 === */
      .node-label {
        font-size: 17px !important;
        font-weight: 800 !important;
        fill: #fff8d6 !important;
        text-shadow: 0 0 18px rgba(255,80,40,0.95), 0 0 4px rgba(0,0,0,0.9) !important;
      }

      /* === 去掉地图标题和状态栏节省空间 === */
      .map-header { margin-bottom: 6px; }
      .eyebrow { font-size: 10px; margin-bottom: 2px; }
      h1 { font-size: clamp(20px,4vw,32px); }
      .status-panel { min-width: auto; gap: 6px; }
      .status-panel span { height: 28px; padding: 0 8px; font-size: 11px; }

      @media (max-width: 820px) {
        .map-stage { height: 550px; }
        .china-map { width: 100%; max-width: none; left: auto; transform: scale(1.15); transform-origin: 50% 48%; }
        .node-label { font-size: 16px !important; }
        .info-card { left: 17px !important; right: 17px; top: auto !important; bottom: 18px; }
      }
      /* === 省份背景暗红色斜划线 === */
      .province-shape {
        fill: url(#hatchPattern) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 注入斜划线 pattern 到 SVG defs
      (function injectHatch() {
        var svg = document.querySelector('.china-map');
        if (!svg) { setTimeout(injectHatch, 200); return; }
        var defs = svg.querySelector('defs');
        if (!defs) { defs = document.createElementNS('http://www.w3.org/2000/svg','defs'); svg.insertBefore(defs, svg.firstChild); }
        if (defs.querySelector('#hatchPattern')) return;
        var pattern = document.createElementNS('http://www.w3.org/2000/svg','pattern');
        pattern.setAttribute('id','hatchPattern');
        pattern.setAttribute('width','12'); pattern.setAttribute('height','12');
        pattern.setAttribute('patternUnits','userSpaceOnUse');
        pattern.setAttribute('patternTransform','rotate(45)');
        var line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1','0'); line.setAttribute('y1','0');
        line.setAttribute('x2','0'); line.setAttribute('y2','12');
        line.setAttribute('stroke','rgba(180,20,30,0.25)');
        line.setAttribute('stroke-width','1.5');
        pattern.appendChild(line);
        defs.appendChild(pattern);
      })();
    </script>
  </body>
</html>
